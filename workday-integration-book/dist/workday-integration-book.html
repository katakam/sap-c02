<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Workday Integration Book</title>
<meta name="description" content="A plain-English, searchable book for Workday integration work: office words, HR basics, payroll, tools, data formats, security, delivery and support.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Workday Integration Book. One calm column. Teal marks structure, amber marks data. */
:root{
  --bg:#F3F6F6;--surface:#FFFFFF;--ink:#13242B;--muted:#51656D;--line:#D5DFE1;
  --accent:#0B7A75;--accent-soft:#DDF0EE;--on-accent:#FFFFFF;
  --amber:#B86A0B;--amber-bg:#FBEBD3;--coral:#B3392F;--coral-bg:#F9E1DE;
  --indigo:#4B4FB8;--indigo-bg:#E4E5F8;--gray:#51656D;--gray-bg:#E9EEEF;--code:#EAF0F1;
  --f-display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A1F;--surface:#16262D;--ink:#E7EFF1;--muted:#9DB1B8;--line:#2A3E46;
    --accent:#4CC2BA;--accent-soft:#123A3A;--on-accent:#0E1A1F;
    --amber:#F0A649;--amber-bg:#3A2A10;--coral:#F07F73;--coral-bg:#3E1D1A;
    --indigo:#A3A6F0;--indigo-bg:#25264A;--gray:#9DB1B8;--gray-bg:#213138;--code:#0B1418;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A1F;--surface:#16262D;--ink:#E7EFF1;--muted:#9DB1B8;--line:#2A3E46;
  --accent:#4CC2BA;--accent-soft:#123A3A;--on-accent:#0E1A1F;
  --amber:#F0A649;--amber-bg:#3A2A10;--coral:#F07F73;--coral-bg:#3E1D1A;
  --indigo:#A3A6F0;--indigo-bg:#25264A;--gray:#9DB1B8;--gray-bg:#213138;--code:#0B1418;color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--on-accent);padding:8px 12px;z-index:100}
.skip:focus{left:8px;top:8px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,6vw,46px)}
h2{font-size:clamp(22px,4vw,28px)}
h3{font-size:18px}
h4{font-size:16px}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)}
.note{font-size:15px;color:var(--muted)}
.lead{font-size:20px;max-width:36em}
mark{background:var(--amber-bg);color:inherit;border-radius:3px;padding:0 1px}
code,.mono{font-family:var(--f-mono);font-size:.9em;background:var(--code);padding:1px 5px;border-radius:4px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:10px 6px}
.brand{font:700 19px var(--f-display);color:var(--ink);text-decoration:none;margin-right:auto}
.sw{position:relative;flex:1 1 100%;min-width:0;order:3}
@media(min-width:760px){.sw{order:0;flex:0 1 460px}}
#q{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
#q:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.sr{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:70vh;overflow:auto;z-index:40;padding:6px}
.sr .g{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 8px 2px}
.sr a.r{display:block;padding:8px;border-radius:6px;text-decoration:none;color:var(--ink)}
.sr a.r:hover,.sr a.r:focus-visible{background:var(--accent-soft)}
.sr .t{display:block;font-weight:700}
.sr .s{display:block;font-size:14px;color:var(--muted)}
.sr .none{padding:12px;color:var(--muted)}
.sr .all{width:100%;margin-top:6px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.tabs a{white-space:nowrap;padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:700;font-size:15px}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]:hover{color:var(--on-accent)}
a:focus-visible,button:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* layout */
main{padding-block:24px 40px}
.view{display:flex;flex-direction:column;gap:18px;min-width:0}
.view[hidden]{display:none}
.foot{padding-block:0 40px;color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.grid2,.grid3{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media(min-width:700px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-size:15px;min-height:40px;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
select,input[type=date],input[type=text]{font:inherit;font-size:15px;min-height:40px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:34px;padding:3px 12px;font-size:14px;border-radius:999px}
.b{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--gray-bg);color:var(--muted);white-space:nowrap}
.lv1{background:var(--accent-soft);color:var(--accent)}
.lv3{background:var(--indigo-bg);color:var(--indigo)}
.k-w{background:var(--amber-bg);color:var(--amber)}
.k-c{background:var(--coral-bg);color:var(--coral)}
.bar2{height:8px;background:var(--gray-bg);border-radius:99px;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--accent)}
.stat{display:flex;flex-direction:column}
.stat b{font:700 30px var(--f-display);color:var(--accent)}

/* library entries */
.e{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;scroll-margin-top:150px}
.e.flash{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.e.known{opacity:.72}
.eh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eh h3{margin-right:4px}
.e .more{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.e .more[hidden]{display:none}
.e .more ul{margin:0;padding-left:20px}
.e .more b{color:var(--accent)}
.ef{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
.ef .tg{min-height:32px;font-size:14px;padding:2px 12px}
.kn{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.kn input{width:18px;height:18px;accent-color:var(--accent)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags a{font-size:13px;background:var(--gray-bg);color:var(--muted);padding:1px 8px;border-radius:99px;text-decoration:none}
.lt{margin-top:10px;color:var(--accent);scroll-margin-top:150px}
.az{display:flex;flex-wrap:wrap;gap:2px}
.az a{min-width:28px;text-align:center;padding:2px 4px;border-radius:6px;text-decoration:none;font-weight:700}
.az a:hover{background:var(--accent-soft)}
.list{display:flex;flex-direction:column;gap:10px}

/* details cards: animations, playbooks, labs */
details.an,details.pb,details.lab{background:var(--surface);border:1px solid var(--line);border-radius:10px;scroll-margin-top:150px}
details>summary{cursor:pointer;padding:14px 16px;display:flex;flex-direction:column;gap:2px;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"+";float:right;font:700 22px var(--f-display);color:var(--accent);margin-left:12px}
details[open]>summary::before{content:"\2212"}
summary .at{font:700 18px var(--f-display)}
summary .as{color:var(--muted);font-size:15px}
.ab,.pbb,.labb{padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pbb h4{color:var(--accent);margin-top:4px}
.pbb ul,.pbb ol{margin:0;padding-left:22px}
.dont{background:var(--coral-bg);color:var(--ink);border-radius:8px;padding:10px 12px}
.dont b{color:var(--coral)}

/* animation stage */
.stage{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){.stage{grid-template-columns:380px minmax(0,1fr);align-items:start}}
.sv{min-width:0}
.asvg{display:block;width:100%;max-width:380px;height:auto;margin:0 auto}
.asvg .nd rect{fill:var(--surface);stroke:var(--line);stroke-width:1.6;transition:stroke .3s,opacity .3s}
.asvg .nd{transition:opacity .4s}
.asvg .nd.c-teal rect{fill:var(--accent-soft);stroke:var(--accent)}
.asvg .nd.c-amber rect{fill:var(--amber-bg);stroke:var(--amber)}
.asvg .nd.c-coral rect{fill:var(--coral-bg);stroke:var(--coral)}
.asvg .nd.c-indigo rect{fill:var(--indigo-bg);stroke:var(--indigo)}
.asvg .nd.c-gray rect{fill:var(--gray-bg);stroke:var(--line)}
.asvg .nd.cont rect{fill:none;stroke-dasharray:6 4}
.asvg .nd.dash rect{stroke-dasharray:5 4}
.asvg .nd.act rect{stroke-width:3.4}
.asvg .nd.dim{opacity:.5}
.asvg .nd.hid{opacity:0}
.asvg .nt{font:700 14px var(--f-display);fill:var(--ink)}
.asvg .ns{font:12px var(--f-body);fill:var(--muted)}
.asvg .ed{fill:none;stroke:var(--muted);stroke-width:1.8;transition:opacity .4s}
.asvg .ed.act{stroke:var(--accent);stroke-width:2.8}
.asvg .ed.dim{opacity:.35}
.asvg .ed.dash{stroke-dasharray:5 4}
.asvg .ed.hid{opacity:0}
.asvg .el{font:12px var(--f-body);fill:var(--muted)}
.asvg .chip rect{fill:var(--amber-bg);stroke:var(--amber);stroke-width:1.5}
.asvg .chip text{font:500 12px var(--f-mono);fill:var(--ink)}
.asvg .chip.bad rect{fill:var(--coral-bg);stroke:var(--coral)}
.asvg .chip{transition:transform .9s ease,opacity .4s}
@media (prefers-reduced-motion:reduce){.asvg .chip,.asvg .nd,.asvg .ed,.asvg .nd rect{transition:none}}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{min-width:40px;padding:4px 10px}
.cap h4{color:var(--accent);font-size:18px}
.cap .p{margin-top:6px}
.tech{margin-top:8px;font-size:15px;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px}
.tech:empty{display:none}
.data{font:13px/1.6 var(--f-mono);background:var(--code);border-radius:8px;padding:12px 14px;margin:0;white-space:pre;overflow-x:auto;min-height:48px}
.data:empty{display:none}

/* playbooks, phrases, templates */
.ph,.tpl{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;scroll-margin-top:150px}
.ph .say{font:700 18px var(--f-display)}
.ph dl{margin:0;display:grid;gap:6px}
.ph dt{font-weight:700;color:var(--accent);font-size:14px;text-transform:uppercase;letter-spacing:.05em}
.ph dd{margin:0}
.tpl pre{margin:0;white-space:pre-wrap;font:14px/1.6 var(--f-mono);background:var(--code);border-radius:8px;padding:12px}
.ck{display:flex;flex-direction:column;gap:6px}
.ck label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.ck input{margin-top:5px;width:18px;height:18px;accent-color:var(--accent)}

/* labs */
textarea,.out{width:100%;font:13px/1.6 var(--f-mono);padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:120px;resize:vertical}
.out{background:var(--code);white-space:pre-wrap;overflow-x:auto;min-height:60px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.wide{overflow-x:auto}
.ok{color:var(--accent);font-weight:700}
.bad{color:var(--coral);font-weight:700}
.chk{color:var(--amber);font-weight:700}
.two{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
input[type=range]{width:100%;accent-color:var(--accent)}
.ev{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ev li{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.ev li.live{border-color:var(--accent);background:var(--accent-soft)}
.ev li.off{opacity:.45}
.res{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:700px){.res{grid-template-columns:repeat(4,minmax(0,1fr))}}
.res div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}
.res small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.res b{font:700 18px var(--f-display)}

/* job map, quiz */
.jd{display:grid;gap:8px;grid-template-columns:minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;scroll-margin-top:150px}
@media(min-width:760px){.jd{grid-template-columns:minmax(0,1fr) 190px}}
.jd .links{display:flex;gap:6px;flex-wrap:wrap}
.jd .links a,.jd .links button{font-size:13px;min-height:30px;padding:1px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--accent);text-decoration:none;cursor:pointer}
.quiz .opt{display:block;width:100%;text-align:left;margin-top:8px}
.quiz .opt.right{border-color:var(--accent);background:var(--accent-soft)}
.quiz .opt.wrong{border-color:var(--coral);background:var(--coral-bg)}

</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#start">Workday Integration Book</a>
    <button id="theme" type="button" aria-label="Change colour theme">Auto</button>
    <div class="sw">
      <input id="q" type="search" placeholder="Search anything: PECI, effective date, 403, PFA" autocomplete="off" spellcheck="false" aria-label="Search the whole book">
      <div id="sr" class="sr" hidden></div>
    </div>
  </div>
  <nav class="wrap tabs" id="tabs" aria-label="Sections"></nav>
</header>
<main id="main" class="wrap">
  <section id="v-start" class="view" hidden></section>
  <section id="v-library" class="view" hidden></section>
  <section id="v-animations" class="view" hidden></section>
  <section id="v-playbooks" class="view" hidden></section>
  <section id="v-meetings" class="view" hidden></section>
  <section id="v-labs" class="view" hidden></section>
  <section id="v-jobmap" class="view" hidden></section>
  <section id="v-quiz" class="view" hidden></section>
</main>
<footer class="wrap foot">
  <p>A learning aid, not official Workday documentation. All names and data are dummy. Setup differs in every company, so verify details in your own tenant and with your team.</p>
</footer>
<script>
/* ---- assets/book.js ---- */
/* Core data model and search. Content files call BOOK.E, BOOK.PB, BOOK.PH and so on. */
(function(){
'use strict';
var B=window.BOOK={parts:[],entries:[],anims:[],playbooks:[],phrases:[],templates:[],checks:[],jd:[],quiz:[],labs:[],docs:[]};
var used={};
function slug(s){return String(s).toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
function uid(p,t){var b=p+slug(t).slice(0,56),i=b,n=2;while(used[i]){i=b+'-'+n++}used[i]=1;return i}
B.slug=slug;
B.LV={1:'Start here',2:'Core',3:'Deeper'};
B.KD={g:'General IT',w:'Workday',c:'Depends on company'};

B.part=function(id,name,blurb){B.parts.push({id:id,name:name,blurb:blurb})};
/* E(part, term, meaning, example, forMe, level 1-3, kind g|w|c, tags "a b c", aka "other names") */
B.E=function(part,term,m,x,f,lv,k,tags,aka){
  var o={id:uid('t-',term),part:part,term:term,m:m,x:x||'',f:f||'',lv:lv||2,k:k||'g',t:String(tags||'').split(/\s+/).filter(Boolean),aka:aka||''};
  B.entries.push(o);
  return {D:function(a){o.d=a;return this}};
};
B.PB=function(o){o.id=uid('p-',o.title);B.playbooks.push(o)};
B.PH=function(o){o.id=uid('m-',o.say.slice(0,44));B.phrases.push(o)};
B.TP=function(o){o.id=uid('m-t-',o.title);B.templates.push(o)};
B.CK=function(o){o.id=uid('m-c-',o.title);B.checks.push(o)};
B.JD=function(o){o.id=uid('j-',o.item.slice(0,40));B.jd.push(o)};
B.Q=function(o){B.quiz.push(o)};
B.A=function(o){B.anims.push(o)};
B.L=function(o){B.labs.push(o)};

B.tokens=function(q){
  return String(q||'').toLowerCase().split(/[^a-z0-9_+#.\/\-]+/).map(function(t){return t.replace(/^[.\-\/]+|[.\-\/]+$/g,'')}).filter(Boolean);
};
function lc(s){return String(s||'').toLowerCase()}
function mk(type,ref,title,aka,tags,body,sn,tab){
  return {type:type,id:ref.id,ref:ref,title:title,tl:lc(title),al:lc(aka),aw:lc(aka).split(/[^a-z0-9]+/).filter(Boolean),tg:lc(tags),bd:lc(body),sn:sn||'',tab:tab};
}
B.buildIndex=function(){
  var D=[];
  B.entries.forEach(function(e){D.push(mk('term',e,e.term,e.aka,e.t.join(' '),[e.m,e.x,e.f].concat(e.d||[]).join(' '),e.m,'library'))});
  B.playbooks.forEach(function(p){D.push(mk('pb',p,p.title,p.area,p.tags||'',[p.sym].concat(p.may||[],p.check||[],p.evid||[],[p.who,p.dont]).join(' '),p.sym,'playbooks'))});
  B.phrases.forEach(function(p){D.push(mk('phrase',p,p.say,p.theme,'',[p.means,p.fits,p.expect,p.ask,p.reply].join(' '),p.means,'meetings'))});
  B.templates.forEach(function(t){D.push(mk('tpl',t,t.title,'','',t.when+' '+t.body,t.when,'meetings'))});
  B.checks.forEach(function(t){D.push(mk('tpl',t,t.title,'','',t.items.join(' '),'Checklist','meetings'))});
  B.anims.forEach(function(a){D.push(mk('anim',a,a.title,'',a.tags||'',a.sum+' '+a.steps.map(function(s){return s.t+' '+s.p+' '+(s.k||'')}).join(' '),a.sum,'animations'))});
  B.labs.forEach(function(l){D.push(mk('lab',l,l.title,'',l.tags||'',l.desc,l.desc,'labs'))});
  B.jd.forEach(function(j){D.push(mk('jd',j,j.item,'',j.tags||'',j.plain,j.plain,'jobmap'))});
  B.docs=D;
};
function sc(d,t){
  if(d.tl===t)return 60;
  if(d.aw.indexOf(t)>-1)return 50;
  var tw=d.tl.split(/[^a-z0-9]+/);
  if(tw.indexOf(t)>-1)return 40;
  if(d.tl.indexOf(t)===0)return 34;
  for(var i=0;i<tw.length;i++){if(tw[i].indexOf(t)===0)return 28}
  if(t.length>4&&d.tl.indexOf(t)>-1)return 20;
  if(d.al.indexOf(t)>-1)return 18;
  if(d.tg.indexOf(t)>-1)return 12;
  if(d.bd.indexOf(t)>-1)return 3;
  return 0;
}
B.search=function(q,type){
  var toks=B.tokens(q);var out=[];out.partial=false;
  if(!toks.length)return out;
  if(!B.docs.length)B.buildIndex();
  var i,j,d,s,tot,ok;
  for(i=0;i<B.docs.length;i++){
    d=B.docs[i];if(type&&d.type!==type)continue;
    tot=0;ok=true;
    for(j=0;j<toks.length;j++){s=sc(d,toks[j]);if(!s){ok=false;break}tot+=s}
    if(ok)out.push({d:d,s:tot,n:toks.length});
  }
  if(!out.length&&toks.length>1){
    out.partial=true;
    for(i=0;i<B.docs.length;i++){
      d=B.docs[i];if(type&&d.type!==type)continue;
      tot=0;var n=0;
      for(j=0;j<toks.length;j++){s=sc(d,toks[j]);if(s){n++;tot+=s}}
      if(n)out.push({d:d,s:tot,n:n});
    }
  }
  out.sort(function(a,b){return (b.n-a.n)||(b.s-a.s)||(a.d.title.length-b.d.title.length)});
  var res=out.map(function(r){return r.d});
  res.partial=out.partial;
  return res;
};
})();

P("File","A named piece of saved data. Documents, spreadsheets, pictures and data feeds are all files.","payroll_20261104.csv","Most integrations move files, so file basics come first.",1,"file basics");

P("Keyboard shortcuts to learn first","Ctrl+F find. Ctrl+Z undo. Ctrl+S save. Ctrl+A select all. Alt+Tab switch window. Win+Shift+S screenshot.","Ctrl+F inside a 10 MB XML file.","Find (Ctrl+F) saves hours in big files.",1,"shortcut");

A("FYI","For your information. The message only informs you.","FYI, the vendor moved the cut-off to Friday.","No action needed unless it says so. Still read it. It may affect your work.",1,"email office");
A("PFA","Please find attached. The file is attached to the email.","PFA the mapping sheet.","Open the attachment. If it is missing, reply and say so.",1,"email office","please find attached");
A("PFB","Please find below. The content is in the email body below.","PFB the error text from the log.","Scroll down. Everything you need is in the same email.",1,"email office","please find below");
A("ASAP","As soon as possible. It is not a date or a time.","Need the file ASAP.","Ask for a date, a time and a time zone. 'ASAP' means different things to different people.",1,"email office");
A("EOD","End of day.","Please send the report by EOD.","Ask: whose day, and which time zone? Say 'by 6 pm SGT' in your reply.",1,"email office time");
A("COB","Close of business. Like EOD, but tied to office hours.","Reply by COB Friday.","Same advice as EOD. Confirm the time and zone.",1,"email office time");
A("EOW","End of week.","Test results by EOW.","Ask if the week ends Friday or Sunday, and at what time.",2,"email office time");
A("EOM","End of month.","Payroll cut-off is EOM.","Ask for the exact date. Months end on different days.",2,"email office time");
A("ETA","Estimated time of arrival, or of completion.","What is your ETA for the fix?","Give an honest estimate with the assumptions. Do not promise what you cannot check.",1,"email office time");
A("TBD","To be decided.","Go-live date: TBD.","Nobody has decided yet. Do not assume a date.",1,"email office");
A("TBC","To be confirmed.","Vendor path TBC.","A guess exists, but it is not final. Ask who will confirm.",1,"email office");
A("NRN","No reply needed.","NRN. Just sharing.","You may skip a reply. A short 'Noted' is polite.",2,"email office");
A("OOO","Out of office.","I am OOO until Monday.","Check the return date. Find the backup contact.",1,"email office");
A("WFH","Work from home.","WFH today.","They are online but not in the office.",1,"office");
A("WIP","Work in progress.","The mapping is WIP.","It is not finished. Do not treat it as final.",1,"office");
A("LGTM","Looks good to me. Used when reviewing work.","LGTM, please merge.","It means approval. Ask 'approved for what?' if it is unclear.",2,"review office");
A("TAT","Turnaround time. How long a task takes from start to finish.","What is the TAT for an access request?","Ask the owning team for their normal TAT before you promise dates.",2,"office");
A("BAU","Business as usual. Normal daily operations and support, not project work.","This is a BAU ticket.","It is routine run-and-support work.",1,"office support");
A("KT","Knowledge transfer. Sessions where one person teaches another.","KT sessions start Monday.","Ask for recordings and notes. Write your own notes too.",1,"office handover","knowledge transfer");
A("MoM","Minutes of meeting. Notes with decisions and action items.","Who will send the MoM?","If it is given to you, agree and ask for the deadline. Send it the same day.",1,"meeting office","minutes of meeting");
A("POC","Proof of concept (a small test to see if an idea works) or point of contact (the person to talk to).","Run a POC for the new connector.","Context decides. Ask 'proof of concept or point of contact?' if unsure.",1,"office");
A("SPOC","Single point of contact. One person who handles all questions on a topic.","Ravi is our SPOC for the vendor.","Send vendor questions to the SPOC, not to many people.",2,"office");
A("SME","Subject matter expert. The person who knows a topic best.","Ask the payroll SME.","Find the SME for each area early.",1,"office");
A("MVP","Minimum viable product. The smallest version that is still useful.","Let us ship an MVP first.","Expect a first version with limits. Ask what is in and out.",2,"office");
A("AI (action item)","A task agreed in a meeting, with an owner and a date. It can also mean artificial intelligence.","AI: Priya to share the sample file by Friday.","Write your action items down with owner and date. Read them back at the end.",1,"meeting office","action item");
A("AOB","Any other business. The last point on a meeting agenda.","Under AOB, Sam raised the holiday freeze.","New topics may appear here. Listen closely.",2,"meeting office");

A("NB","Nota bene. 'Note well'. Pay attention to this.","NB: do not run in production.","Treat it as important.",2,"email office");
A("RSVP","Please reply. Usually to accept or decline an invite.","RSVP by Thursday.","Reply even if you cannot come.",1,"email office");
A("TIA","Thanks in advance.","Please send the file, TIA.","Polite, but it still means a request.",2,"email office");
A("PTO","Paid time off. Leave that is paid.","He is on PTO.","Check the return date.",1,"office hr");

A("RACI","Responsible, Accountable, Consulted, Informed. A chart of who does what in a task.","Check the RACI for the payroll file.","Know if you are R (does), A (answers for it), C (asked) or I (told).",2,"office");

A("CPU","Central processing unit. The brain of a computer.","The CPU is at 100%.","A busy server can make jobs slow.",2,"hardware");

A("OS","Operating system. Windows, macOS, Linux.","Which OS do you use?","Matters for file paths and tools.",1,"hardware");

/* ---------- Part 4: integration foundations ---------- */
I("Integration","A set-up that moves data from one system to another on its own, without a person copying it.","Workday sends new hires to the payroll vendor every night.","This is your whole job: build it, test it, watch it, fix it.",1,"g","basics");
I("System","A program or service that stores or uses data.","Workday, a payroll vendor, an email server.","Every integration has at least two systems. Name both in every ticket.",1,"g","basics");
I("Source system","The system the data comes from.","Workday, in a worker feed.","Ask: which system is the source of this field? Fixes start there.",1,"g","basics","sender");
I("Target system","The system that receives the data.","The payroll vendor.","The target decides the file format. Get its spec early.",1,"g","basics","receiver,destination");
I("Inbound integration","Data comes INTO Workday.","A new-hire file from a recruiting tool loaded into Workday.","You prepare the file, load it, and read the errors.",1,"w","basics direction");
I("Outbound integration","Data goes OUT of Workday.","A worker file sent to the payroll vendor.","You choose what to send, build the file, deliver it and check it arrived.",1,"w","basics direction");
I("Interface","Another word for integration, or the connection point between two systems.","Payroll interface.","People mix these words. Ask: do you mean a whole feed or one connection?",1,"g","basics");
I("Middleware","A program that sits between systems and passes data along, often changing it on the way.","Boomi, MuleSoft.","Some companies send Workday files to middleware first, not straight to the vendor. Ask.",2,"c","basics tool");
I("Point-to-point","One system connects straight to one other system.","Workday to the payroll vendor.","Simple, but many of these become hard to manage.",3,"g","basics");
I("Batch","Many records sent together at set times.","A nightly worker file.","Most Workday payroll feeds are batch.",1,"g","schedule");
I("Real time","Data moves as soon as it changes.","A hire triggers a message at once.","Rare in basic feeds. Ask whether 'daily' is good enough.",2,"g","schedule","event driven");
I("Schedule","The time an integration runs by itself.","Daily at 02:10 Singapore time.","Always write the time zone. Avoid the top of the hour.",1,"w","schedule");
I("Trigger","The thing that starts a run: a time, a button, or an event.","A schedule or a person pressing launch.","If it did not run, ask what should have triggered it.",1,"g","schedule");
I("Full file","Every record every time.","All 5,000 active workers each night.","Big and simple. Good for first loads and for vendors that replace their data each time.",1,"g","delta","full load");
I("Delta file","Only what changed since the last run.","3 new hires and 2 job changes.","Smaller, but one missed run can lose changes. Checks matter more.",1,"g","delta","changes only,incremental").D(["A delta needs a 'last run' marker so the next run knows where to start.","If the marker moves forward on a failed run, changes can be lost.","In Workday Core Connectors the setting is called Full File. The words 'Changes Only' are not a launch parameter in the Workday guides."]);
I("Change detection","How the integration finds what changed since last time.","Compare today's data with the last run, using dates.","Always ask: what counts as a change, and which dates are used?",2,"w","delta");
I("Last successful run","The time of the last run that finished well. The next delta starts from here.","Last Successful As Of Entry Moment.","If a run fails, check that this marker did not move.",2,"w","delta");
I("Idempotent","Running it twice gives the same result as running it once.","Loading the same row twice does not create two workers.","Ask before you re-run anything: is a second run safe?",3,"g","safety");
I("Re-run","Run an integration again, usually after a failure.","Re-launch after the SFTP server was down.","Not always safe. A re-run can duplicate a load or move the delta marker. Ask first.",1,"g","safety");
I("Source of truth","The one system you trust when two systems disagree.","Often Workday for worker data.","Which system is the truth is a company choice. Ask.",1,"c","basics");
I("Mapping","A table that says which source field goes to which target field.","Workday Legal Last Name goes to column LASTNAME.","Mapping sheets are your main work product. Keep them in a shared place.",1,"g","mapping");
I("Field","One piece of data in a record.","First name, hire date.","Know the type, length and whether it may be empty.",1,"g","data");
I("Record","One row or one item: all fields about one thing.","All data about one worker.","Count records before and after every step.",1,"g","data","row");
I("Transformation","Changing data on the way: formats, codes, combining fields.","Change 2026-11-04 to 04/11/2026.","Most defects happen here. Write each rule down.",1,"g","mapping");
I("Value mapping (code translation)","Swap one system's codes for another's.","Workday 'Full_time' becomes vendor code 'F'.","Keep the table in one place. A new code with no mapping is a classic failure.",2,"g","mapping","crosswalk,lookup table");
I("Default value","What you send when the source field is empty.","Send 'N' if no flag is set.","Agree defaults with the vendor and write them in the spec.",2,"g","mapping");
I("Validation","Checking that data is allowed before using it.","Date must be a real date. ID must not be empty.","Run it before you send. Catch problems early.",1,"g","quality");
I("Reconciliation","Comparing counts and totals between source and target to see if they match.","Sent 5,000 workers, vendor loaded 4,998.","Always do this after a run. Find the 2 missing ones.",1,"g","quality","recon");
I("Control total","A number you compare at both ends.","Record count, or sum of pay.","Put the count in the file trailer or in the email.",2,"g","quality");
I("Header and trailer","The first line (column names or file info) and last line (count or total) of a file.","T|5000 means 5000 records.","The vendor may reject a file with a wrong trailer count.",2,"g","file");
I("Delimiter","The character that separates fields in a line.","comma, pipe |, tab.","If a name has a comma and the delimiter is a comma, the file breaks. Quote the field.",1,"g","file","separator");
I("Encoding","How letters are stored as bytes. UTF-8 is the common one.","Names with accents or Chinese characters.","If names show as strange symbols, suspect the wrong encoding.",1,"g","file","charset");
I("BOM","A few hidden bytes at the very start of a UTF-8 file.","Excel adds one when saving 'CSV UTF-8'.","Some vendors reject files with a BOM. Check if they want it.",2,"g","file","byte order mark");
I("Line endings","The hidden mark at the end of each line. Windows uses CRLF. Linux uses LF.","CRLF vs LF.","Some servers need one specific type. Ask the vendor.",2,"g","file","CRLF,LF");
I("File naming convention","Agreed rule for names of files sent or received.","WORKERS_yyyymmdd_hhmm.csv","The receiver often looks for the exact name. A wrong name means 'file not found'.",1,"c","file");
I("Sequence number","A counter in the file name or content that goes up on each run.","FILE_0007.csv","Lets the receiver detect missing or repeated files.",3,"g","file");
I("Shared storage","A location both systems can reach, where files wait to be picked up.","An SFTP folder.","Workday drops the file; the vendor picks it up. Neither talks to the other directly.",1,"g","storage").D(["Name the folder, the owner and who can read it.","Know how long files stay there before cleanup.","If the file is missing, check both sides: did the sender drop it, and did the receiver get permission?"]);
I("SFTP","Secure File Transfer Protocol. A safe way to put and get files on a server.","sftp.vendor.example, port 22.","The most common way files move in Workday integrations.",1,"g","transport","secure ftp");
I("FTP and FTPS","FTP is old and not encrypted. FTPS is FTP with encryption.","Use SFTP or FTPS, not plain FTP.","Never send employee data over plain FTP.",2,"g","transport");
I("Port","A numbered door on a server. SFTP uses 22. HTTPS uses 443.","Port 22.","If a firewall blocks the port, connections time out.",2,"g","transport network");
I("Host name","The name of a server.","sftp.vendor.example","A wrong or changed host name means 'cannot connect'.",1,"g","transport network","hostname");
I("Firewall","A guard that allows or blocks network traffic.","Blocks port 22 from unknown addresses.","Ask the vendor if they need to allow-list addresses. Workday guides say it does not support allow lists of vendor addresses for integrations.",2,"g","network security");
I("Credentials","User name plus password, key or token used to log in.","Service account and SSH key.","Never share them in email or chat. Ask for them through the approved channel.",1,"g","security");
I("SSH key","A pair of files. The public one goes on the server; the private one stays with you.","id_rsa and id_rsa.pub.","Only ever share the public key.",2,"g","security transport");
I("PGP encryption","A way to lock a file so only the holder of the right key can open it.","payroll.csv.pgp","Files are encrypted before sending and decrypted on arrival. Key expiry breaks runs.",2,"g","security encryption");
I("Retry","Trying again after a failure.","Try the upload 3 times, 5 minutes apart.","Workday guides say only SFTP has configurable delivery attempts. Do not assume other transports retry.",2,"w","errors");
I("Error handling","What the integration does when something is wrong.","Skip bad row, log it, continue. Or stop everything.","Ask: stop or continue? Who gets told?",1,"g","errors");
I("Exception","A record or event the integration could not handle.","A worker with no pay group.","Keep a daily exception list and clear it.",1,"g","errors");
I("Log","A written record of what happened during a run.","Run started 02:10, 5,000 records, 0 errors.","Always look at the log before you guess.",1,"g","errors monitoring");
I("Monitoring","Watching runs and being alerted when something fails.","Email to the support list on failure.","Know where alerts go and who answers.",1,"g","monitoring");
I("Alert","A message that something needs attention.","'Integration failed' email.","An alert that nobody reads is useless. Check the list is current.",1,"g","monitoring");
I("Timeout","Giving up after waiting too long.","A report took more than the limit.","Either slow data or an overloaded system. Try a smaller request.",2,"g","errors");
I("Throttling","The system slows or refuses calls when too many arrive.","HTTP 503 or 429.","Space out calls and retry later. Workday advises back-off and caching.",2,"w","errors performance");
I("Pagination (paging)","Getting a big result in pages.","Page 1 of 50, 100 items each.","Missed pages mean missing workers. Keep the same 'as of' values on every page.",2,"g","api performance","paging");
I("Data volume","How many records move.","5,000 workers daily, 500,000 time rows monthly.","Volume decides the tool, the timing and the limits.",1,"g","performance");
I("Dummy data","Made-up data used for learning and tests.","Priya Test, E9001.","Use it for screenshots, labs and chat. Never paste real employee data.",1,"g","privacy testing","test data,mock data");
I("Specification (spec)","A document that says exactly what the integration does.","Fields, formats, schedule, error rules.","Get it written and signed off before building.",1,"g","delivery","functional spec,technical spec");
I("Interface agreement","A short document both teams agree on: contact, schedule, format, error plan.","Names, times, folder, file name rule.","Saves arguments later.",2,"c","delivery");
I("Endpoint","The address you call or send to.","https://vendor.example/api/workers","Test and production endpoints differ. Check which one is set.",1,"g","api","URL");
I("Webhook","A call a system makes to yours when something happens.","Vendor tells Workday 'job done'.","Rare in beginner work. Good to recognise.",3,"g","api");
I("Payload","The data part of a message.","The XML body of a SOAP call.","Look at the payload when you debug.",2,"g","api","body");
I("Idempotency key","A unique ID so a repeated call is not processed twice.","request-8f2c","Helps stop duplicates when you retry.",3,"g","api safety");

/* ---------- Part 5: formats and web ---------- */
F("Data format","The shape in which data is written so another system can read it.","CSV, XML, JSON, fixed width.","The target tells you which one.",1,"g","format");
F("CSV","Comma-separated values. Plain text, one record per line, fields split by commas.","EmployeeID,Name\\nE1001,Priya","Easy but fragile: a comma inside a value breaks it unless it is quoted.",1,"g","format csv").D(["First line is usually the column names.","A value with a comma, quote or line break must be wrapped in double quotes.","Dates, leading zeros and long numbers can be damaged when Excel opens the file."]);
F("Quoted field","A value wrapped in double quotes so special characters are safe.","\"Sharma, Priya\"","Check quotes if a row has too many columns.",2,"g","csv");
F("Fixed width","Each field takes an exact number of characters.","Name 20 chars, then date 8 chars.","Old systems use it. One extra space moves every later field.",2,"g","format");
F("Pipe delimited","A text file using | between fields.","E1001|Priya|2026-01-05","Safer than comma when names have commas.",1,"g","format csv");
F("XML","Extensible Markup Language. Data inside named tags in a tree.","<worker><name>Priya</name></worker>","Workday web services and many connectors use XML. Learn to read it.",1,"g","format xml").D(["Every opening tag needs a closing tag.","Tags can sit inside tags. That is the tree.","Case matters: <Name> and <name> are different.","Special characters need escapes: & becomes &amp;, < becomes &lt;."]);
F("Tag, element, attribute","Tag is the name in angle brackets. Element is the tag with its content. Attribute is extra info inside the opening tag.","<name type=\"legal\">Priya</name>","You will use these words every day with XPath.",1,"g","xml");
F("Root element","The one outer element that holds everything in an XML document.","<Workers> ... </Workers>","A valid XML file has exactly one root.",2,"g","xml");
F("Well-formed XML","XML that follows the basic rules: matching tags, one root, escaped symbols.","Closed tags, quoted attributes.","The first check when a file is rejected.",2,"g","xml");
F("Schema (XSD)","A file that describes which elements an XML document may have, in which order and type.","PICommonOutput.xsd","If the output fails 'schema validation', it does not match the agreed shape.",2,"g","xml validation","XML Schema");
F("Namespace","A label that stops two XML words with the same name from clashing.","xmlns:wd=\"urn:com.workday.report/MyReport\"","XPath on namespaced XML needs the prefix. A missing prefix is the most common XPath mistake.",2,"g","xml");
F("XPath","A way to point at one part of an XML document.","/Workers/Worker/Name","Use it to find a value in XML and in XSLT.",1,"g","xml xpath").D(["//Name finds every Name element anywhere.","Worker[@id='E1001'] picks one by an attribute.","text() gets the words inside an element.","Try the XPath lab in this book."]);
F("XSLT","A language that turns one XML into another XML or text, using rules.","Turn Workday XML into a pipe-delimited file.","Used in Workday Document Transformation. You write templates that match parts of the XML.",2,"g","xml xslt transform").D(["xsl:template match says which part of the input to handle.","xsl:value-of select writes a value.","xsl:for-each loops over repeated elements.","Workday guides recommend XSLT 3.0 for EIB attachments, while their own sample declares 2.0. Ask which version your tenant uses."]);
F("XSLT template","A block that says what to do when a given XML part is found.","<xsl:template match=\"Worker\">","Read an XSLT as a list of these blocks.",2,"g","xslt");
F("XQuery","A query language for XML. Different from XPath and XSLT.","Rare in Workday work.","Know the name. You will mostly use XPath and XSLT.",3,"g","xml");
F("XML to text conversion","Turning XML into CSV or fixed-width text.","Workday offers XTT for this in Document Transformation.","The vendor often wants text, not XML.",2,"w","xslt transform","XTT");
F("JSON","JavaScript Object Notation. Data as name and value pairs in braces.","{\"name\":\"Priya\",\"id\":\"E1001\"}","REST APIs usually use JSON.",1,"g","format json").D(["Objects use { }, lists use [ ].","Strings are in double quotes.","No comments allowed.","No trailing commas."]);
F("Array (list)","An ordered list of items.","[\"E1001\",\"E1002\"]","A worker with two jobs is a list of two jobs.",2,"g","json");
F("Key and value","A name and what it holds.","\"city\": \"Singapore\"","Same idea in JSON, config files and mapping.",1,"g","json");
F("YAML","A readable data format that uses indentation.","name: Priya","Used in config files. Seen in DevOps.",3,"g","format");
F("Flat file","A file with simple rows and columns, no nesting.","CSV or fixed width.","Easy to load, hard to show a worker with two jobs on one row.",2,"g","format");
F("Nested data","Data inside data, like a worker with a list of jobs inside.","XML and JSON do this naturally.","Mapping nested data to a flat file needs a rule: one row per worker or per job?",2,"g","format");
F("Date format ISO 8601","The standard way to write dates: year-month-day.","2026-11-04, or 2026-11-04T10:30:00+08:00","Use it when you can. 04/11 can mean 4 Nov or 11 Apr.",1,"g","date time");
F("Time zone offset","How far a time is from UTC.","+08:00 for Singapore.","Missing offsets cause 'date off by one' bugs.",1,"g","date time");
F("UTC","The world reference time. No daylight saving.","03:00 UTC is 11:00 in Singapore.","Systems store UTC and show local time.",1,"g","date time");
F("Epoch time","Seconds since 1 Jan 1970 UTC.","1793000000","You may see it in logs.",3,"g","date time","unix time");
F("Null versus empty","Null means no value. Empty means a value that has nothing in it.","\"\" vs null","Different systems treat them differently. Ask what an empty field should do.",2,"g","data");
F("Escape character","A symbol that says the next character is plain text.","\\\" inside a JSON string.","If a value with a quote breaks the file, escaping is the fix.",2,"g","data");
F("HTTP","The language browsers and APIs use to talk over the web.","GET /workers","Almost every web API sits on top of HTTP.",1,"g","web http");
F("HTTPS","HTTP with encryption.","https://example.com","Always use it for employee data.",1,"g","web http");
F("HTTP methods","Verbs that say what you want.","GET read, POST create, PUT replace, PATCH change, DELETE remove.","In REST, GET needs View permission. POST, PUT, PATCH and DELETE need Modify in Workday.",2,"g","web http");
F("HTTP status codes","A number the server replies with.","200 OK, 400 bad request, 401 not signed in, 403 not allowed, 404 not found, 429 too many, 500 server error, 503 busy.","The first digit tells you who to chase: 4xx you, 5xx them.",1,"g","web http").D(["200 to 299 worked.","401: login failed or token expired.","403: logged in but no permission.","404: wrong address or ID.","429 and 503: slow down and retry later."]);
F("Request and response","The question you send and the answer you get back.","GET /workers returns a list.","Save both when you report a problem (remove real personal data).",1,"g","web api");
F("Header","Extra info sent with a request or response.","Authorization: Bearer abc, Content-Type: application/json","Missing or wrong headers are a frequent cause of 401 and 415.",2,"g","web api");
F("Query string","The part of a URL after the question mark.","?format=json&from=2026-11-01","Prompts to Workday reports are passed this way.",2,"g","web url");
F("API","Application programming interface. A defined way for programs to talk.","Workday web services and REST API.","Learn what the API can and cannot do before promising features.",1,"g","api","application programming interface");
F("SOAP","An older style of web service that sends XML envelopes and uses a WSDL.","Workday Web Services.","Workday SOAP supports several thousand operations. Get/Put permissions apply to SOAP only.",2,"w","api soap").D(["The message is an XML envelope with header and body.","The WSDL file describes the operations.","Always give the version in the request. An unversioned call is treated as v15 per Workday guides."]);
F("WSDL","The description file of a SOAP service: operations, inputs and outputs.","A .wsdl file or a link ending ?wsdl","Download it to see what a service offers.",2,"g","api soap");
F("REST","A style of web API that uses URLs, HTTP verbs and usually JSON.","GET /workers/12","Workday REST has fewer operations than SOAP and suits smaller transactions.",2,"g","api rest");
F("OAuth 2.0","A way for a program to get a token to call an API without sharing a password.","Authorization code grant with PKCE.","Workday REST uses it. The only RaaS recipe in the guides we checked also uses it.",2,"g","api security oauth");
F("Access token","A temporary key a program shows with each API call.","Bearer eyJ...","Tokens expire. A 401 after an hour often means an expired token.",2,"g","api security oauth","bearer token");
F("Basic authentication","Sending user name and password with each call.","Authorization: Basic ...","Simple, less safe. Allowed only where the system supports it.",2,"g","api security");
F("API client","A registered application that is allowed to call an API.","An OAuth client with a scope.","In Workday you register API clients and choose scopes (functional areas).",2,"w","api oauth","Register API Client");
F("Scope","Which parts of the system a token may reach.","Staffing, Integration.","Wrong scope gives 403 even with a valid token.",2,"g","api security");
F("Web service","A program that other programs can call over a network.","Get_Workers.","Workday exposes data as web services.",1,"g","api");
F("Operation","One action a SOAP service offers.","Get_Workers, Put_Applicant","Names begin with Get, Put, Import or Submit in Workday.",2,"w","api soap");
F("Get_Workers","A Workday web service operation that returns worker data.","Request with Response_Filter and Response_Group.","The usual way to read workers by SOAP.",2,"w","api soap");
F("Response_Filter","Settings in a Workday Get request that limit which records come back.","As_Of_Effective_Date, As_Of_Entry_DateTime, Page, Count","Always set As_Of_Entry_DateTime yourself for stable paging.",3,"w","api soap paging");
F("Response_Group","Settings that choose which sections of a record come back.","Include_Reference, Include_Personal_Information","Ask for only what you need. Large groups are slow.",3,"w","api soap");
F("Reference ID","A named ID for an object that stays the same in every tenant.","Employee_ID = E1001","Use reference IDs, not WIDs, in integrations. WIDs differ between tenants.",2,"w","ids reference","Reference ID type,ID type");
F("WID","Workday ID. A 32-character system key that never changes but differs in each tenant.","a1b2c3...","Do not hard-code WIDs. A WID from Sandbox will not work in Production.",2,"w","ids","Workday ID");
F("Descriptor","The display name of an object, such as a worker's name.","Priya Sharma (E1001)","Do not use descriptors as keys. Workday guides say not to use them as an index or identifier.",2,"w","ids");
F("Rate limit","A cap on how many calls you may make in a time.","100 calls per minute.","Spread calls out.",2,"g","api performance");
F("Compression (gzip)","Making data smaller to send.","payroll.csv.gz","Receivers must know to decompress.",3,"g","format");
F("Base64","A way to write binary data as text.","Used for attachments inside XML.","If you see long strings of letters and = signs, it may be Base64.",3,"g","format");
F("Regular expression (regex)","A pattern to find or check text.","^E[0-9]{4}$ matches E1001","Handy for checks. Test patterns on dummy data.",3,"g","text");
F("Character limit","Maximum length a field can hold.","City: 15 characters.","Long names get cut or rejected. Check lengths before sending.",1,"g","data");
F("Data type","What kind of value a field holds.","text, number, date, true/false.","A text 'N/A' in a number field is rejected.",1,"g","data");

/* ---------- Part 6: Workday HR ---------- */
H("Workday","A cloud system that holds HR, payroll-related, and finance data for a company.","Your company logs in on the web; Workday runs the servers.","You do not install it. You work with settings, reports and integrations.",1,"w","basics");
H("Tenant","One company's own separate copy of Workday and its data.","The Sandbox tenant and the Production tenant of one company.","Always check which tenant you are in. The Workday guides we checked use the word but do not define it.",1,"w","basics environment");
H("Environment","A copy of the tenant used for a purpose: build, test or live.","Production, Implementation, Sandbox, plus Preview types.","Guides name Production, Implementation, Sandbox, Sandbox Preview, Implementation Preview. Which ones your company has depends on the contract.",1,"c","environment");
H("Worker","The umbrella word: an employee or a contingent worker.","Priya (employee), Sam (contractor).","Say 'worker' unless you mean one kind. Contingent workers cannot join pay groups.",1,"w","worker basics").D(["Employee: hired with the Hire Employee process.","Contingent worker: hired with Contract Contingent Worker.","Pre-hire: a person tracked before employment.","Contingent workers do not have pay groups, compensation packages or resignation."]);
H("Employee","A worker hired on the company's payroll.","Priya, Data Analyst.","The usual payroll audience.",1,"w","worker");
H("Contingent worker","A worker who is not an employee: a contractor or consultant.","Sam, contractor via an agency.","They are not in normal payroll feeds. Third-party payroll interfaces do not support them; Workday has a different interface for that (WECI).",2,"w","worker","contractor,CW");
H("Pre-hire","A person being tracked before they become a worker.","A candidate who accepted an offer.","Appears before the Hire event.",2,"w","worker");
H("Person","The human being. One person can have more than one worker record over time.","Priya, rehired in 2026.","Rehires create confusion: same person, new or reused worker ID.",2,"w","worker");
H("Employee ID","A business ID Workday generates for an employee (a sequence).","E1001","Not the same as the WID. May stay the same or change on rehire or conversion, depending on tenant settings.",1,"w","ids","worker ID,Employee_ID");
H("Reuse Worker ID / Reuse Former Worker ID","Tenant settings that decide if an ID stays the same on conversion or rehire.","A rehire keeps old ID E1001 when the setting is on.","If the vendor expects stable IDs, ask which setting is on.",3,"c","ids settings");
H("Supervisory organization","A group of workers and positions arranged in a management tree. It holds jobs, positions and business process rules.","Data Team under Technology.","The manager is a role; the manager belongs to the organization above. It is the main org tree most reports use.",1,"w","org").D(["Each supervisory org has one staffing model.","Workers can only move between orgs that use the same staffing model.","The manager sits in the parent organization, not in the group they manage."]);
H("Organization hierarchy","The tree of organizations, top to bottom.","Company > Division > Department > Team.","'Send the org hierarchy' needs a clear rule for levels, order and top node.",1,"w","org","org tree");
H("Organization types","Workday has several kinds of organizations, each with its own hierarchy.","Supervisory, Company, Cost Center, Location, Pay Group.","Do not say 'the org' without saying which type.",2,"w","org");
H("Company","The legal entity that holds a set of books.","Acme Singapore Pte Ltd","Payroll is often run per company. Not the same as the payroll company object.",1,"w","org");
H("Cost center","A unit used to track cost.","CC100 Technology","Payroll cost is posted to cost centers.",2,"w","org finance");
H("Location","A place where a worker works.","Singapore HQ","Used for holidays, taxes and reports.",2,"w","org");
H("Staffing model","The way a supervisory org fills roles: Position Management or Job Management.","Org A uses positions; Org B uses jobs.","It is set per supervisory org, not per tenant. Ask which model applies to the org in question.",1,"w","position job").D(["Position Management: you need an open, approved position before you can hire.","Job Management: no position needed; unlimited openings.","The change is set on the supervisory org; changing a parent does not change existing child orgs."]);
H("Position","A seat in the org that one worker can fill.","Data Analyst, position P-0042.","Under Position Management you hire into a position. In Job Management 'position' is still used loosely, so ask which sense.",1,"w","position");
H("Job","What a worker does in the company, tied to a job profile and an org.","Priya's job: Data Analyst.","A worker can have more than one job.",1,"w","job");
H("Job profile","The generic description of a job.","Data Analyst, with job family and level.","Used by compensation and reports. Almost all its fields are effective-dated except Job Code.",2,"w","job");
H("Job family and job family group","Ways to group job profiles. Job Family Group > Job Family > Job Profile.","Engineering > Data > Data Analyst.","A profile can be in several families; a family belongs to one group.",2,"w","job");
H("Worker type","Employee or contingent worker kind used in hiring restrictions.","Employee, Contingent Worker.","Do not confuse with employee type.",2,"w","worker");
H("Employee type","A list value: Regular, Intern, Temporary.","Regular","Admins can add values. Vendors may need a mapping.",2,"w","worker");
H("Multiple jobs (multiposition worker)","A worker who holds more than one position or job at the same time: one primary job and one or more additional jobs.","Priya is Data Analyst 60% and Trainer 40%.","The Workday guides do not use the phrase 'concurrent employment'. They say primary job plus additional jobs. Payroll works per position.",1,"w","job position multiple","concurrent employment,additional job,multiposition").D(["It is switched on in the tenant setup (Position Setup Options: Multiple Jobs).","You cannot add an additional job before there is a primary job.","Add Additional Jobs, End Jobs and Switch Primary Job are the tasks.","Worker-based reports return the primary position's data.","In Core Connector: Worker, Include Multiple Positions returns additional jobs.","A one-row-per-worker file hides extra jobs. Decide: one row per worker or per job?","Payroll support for multiple jobs depends on the payroll set-up and vendor. Ask."]);
H("Primary job","The main job. The first job from hire is primary.","Priya's Data Analyst job.","Termination rules, holiday calendar and benefit rates are driven by the primary job. Switch Primary Job changes it.",1,"w","job multiple","primary position");
H("Additional job","Any job besides the primary.","Priya's Trainer job.","Make sure integration steps include or skip additional jobs on purpose.",1,"w","job multiple","additional position");
H("Switch Primary Job","A task that changes which job is primary.","Make the Trainer job primary.","It can reset in-progress pay results. Tell payroll before it is done.",3,"w","job multiple");
H("International assignment","A worker temporarily working in another country.","6 months in Tokyo.","Handled with an additional position in some set-ups. Ask payroll how.",3,"w","job multiple");
H("Worker history","The list of everything that has happened to a worker, event by event, over time.","Hire, job change, pay change, leave, termination.","History is dated twice: when it counted, and when it was typed.",1,"w","history").D(["Each change is an event with an effective date.","Events are processed in a business process.","Correct fixes an event in place; Rescind reverses a completed one; the event stays in history.","View Worker History and the Job History report show the timeline."]);
H("Effective date","The date a change takes effect in the business.","Promotion effective 1 Nov.","Can be in the past (back-dated) or future (future-dated).",1,"w","history date","effective dated");
H("Entry moment","The date and time the change was entered into Workday.","Typed on 5 Nov at 09:12.","Delta integrations use it to find late-entered changes. It is the second date.",1,"w","history date","entry date,entry date time");
H("As-of date","The date you look at the data from.","Show me the org as of 1 Oct.","Workday has two: as-of effective date and as-of entry moment.",1,"w","history date");
H("Effective dating","Storing each value with the date it starts, so history is kept.","Salary 5000 from Jan, 5500 from Jul.","Always ask 'as of when?' when you read data.",1,"w","history");
H("Back-dated change","A change entered today with an earlier effective date.","Entered 5 Nov, effective 1 Oct.","Can change pay that is already paid. Tell payroll. A delta based only on effective date will miss it.",1,"w","history retro");
H("Future-dated change","A change entered now that starts later.","Promotion starting 1 Dec.","Decide whether the feed sends it now or on the date.",2,"w","history");
H("Retroactive change","A change that affects a period already processed.","Pay rise back to 1 Oct.","Triggers a retro pay calculation in payroll.",2,"w","history retro payroll","retro");
H("Out-of-order change","A change inserted between two events already in history.","A job change dated between hire and a later transfer.","Workday does not apply corrections to later events automatically. Check the knock-on effect.",3,"w","history");
H("Correction","Editing an event in place to fix a mistake.","Fix a wrong hire date.","Corrections do not trigger approvals or notifications. Limits apply.",2,"w","history bp","Correct");
H("Rescind","Reverse a completed event so it is as if it did not happen. History keeps a record.","Rescind a termination.","Different from Cancel.",2,"w","history bp");
H("Cancel","Stop an in-progress business process.","Cancel a pending hire.","Cannot cancel one that is already complete.",2,"w","history bp");
H("Business process","A set of steps that people do to complete a change, such as hiring.","Hire Employee: initiate, review, approve, complete.","Every worker change goes through one. Integrations can start them or wait for them.",1,"w","bp").D(["It is based on a business process definition.","Steps include Initiation, Action, Approval, To Do, Integration, Report.","Each definition has its own security policy; business processes are not secured by domains.","An Integration step can fail the whole process unless a redirect is set."]);
H("Business process definition","The recipe: steps, order and who does what.","Hire Employee definition for Data Team.","Chosen by when the process is started, not by effective date.",2,"w","bp");
H("Initiation step","The first step. Someone starts the process.","Manager starts a Change Job.","Always the first step.",2,"w","bp");
H("Approval step","A step where someone must approve.","HR partner approves a salary change.","Pending approvals hold back the effective change in feeds.",2,"w","bp");
H("To Do","A task step with a checklist.","Complete the equipment checklist.","Does not move data. It waits for a person.",2,"w","bp");
H("My Tasks","The Workday place where work waiting for you shows up.","Approve a hire.","The guides say 'My Tasks' for actionable items; notifications need no action.",2,"w","bp");
H("Notification","A message that needs no action.","Your report finished.","Different from a task.",2,"w","bp");
H("Hire","The event that creates an employee in Workday.","Hire Employee.","The first job becomes the primary job.",1,"w","lifecycle");
H("Change Job","The event for transfers, promotions, demotions and location changes.","Promote Priya to Senior Analyst.","One of the most common reasons for a feed to send a record.",1,"w","lifecycle");
H("Termination","The event that ends employment. Effective at the end of the termination date in the work location's time zone.","Last day 31 Oct.","If the worker has additional jobs, end them first. Payroll needs the date in the vendor's expected format.",1,"w","lifecycle");
H("Rehire","Hiring a former worker again.","Priya returns in 2027.","Same person; ID reuse depends on tenant settings.",2,"w","lifecycle");
H("Leave of absence","A period when the worker is away but still employed.","Maternity leave.","Payroll may stop or reduce pay. Leave data covers the primary position only in some payroll interfaces.",2,"w","lifecycle");
H("Request Leave of Absence / Return from Leave","The tasks that start and end a leave.","Request Leave of Absence.","Use the task name when you search in your tenant.",3,"w","lifecycle");
H("No Show / Hire Rescind","Ways to undo a hire before the person starts.","Candidate never joined.","Not the same as a termination.",3,"w","lifecycle");
H("Reorganization","A planned change to the org tree, grouped under one effective date.","Merge two teams on 1 Jan.","An org can have only one future-dated reorg at a time. Feeds should handle it.",3,"w","org");
H("Role assignment","A person assigned to a role, such as manager or HR partner, for an org.","Ravi is manager of Data Team.","Roles drive approvals and security.",2,"w","org security");
H("Compensation","Pay information: salary, allowances, bonuses.","Base salary 6000 SGD per month.","Highly sensitive. Restrict who can see and export it.",1,"w","compensation");
H("Compensation package","The set of compensation plans a worker has.","Salary plan plus allowance plan.","Contingent workers do not have packages.",2,"w","compensation");
H("Pay group","An organization of workers who share a pay frequency and period schedule.","Monthly Singapore Staff.","Each worker in Workday Payroll must be in exactly one pay group, unless multiple jobs is used.",1,"w","payroll");
H("Pay frequency","How often pay runs.","Monthly, weekly.","Part of the pay group design.",1,"w","payroll");
H("Time off and absence","Leave a worker takes, tracked in Workday.","Annual leave 3 days.","Payroll may need unpaid leave. Ask which absence types matter.",2,"w","absence");
H("Calendar and holidays","Dates the company treats as non-working.","National Day.","Based on the location of the primary position.",3,"w","calendar");
H("Contact information","Addresses, phones, emails.","Home address.","Sensitive. Include only if the vendor needs it.",2,"w","privacy");
H("National ID","Government ID number kept in Workday.","NRIC (dummy: S0000000A).","Very sensitive. Never paste real ones in tickets or chat.",2,"w","privacy");
H("Bank account (payment election)","Where pay is sent.","Account number (dummy).","Payroll needs it. Encrypt files that carry it.",2,"w","payroll privacy");

/* ---------- Part 7: reports and data ---------- */
R("Report","A saved question you ask Workday about its data.","All Active Workers.","Most integrations start from a report. Know which report and who owns it.",1,"w","report");
R("Standard report","A report Workday delivers.","Find Workers.","Never use a standard report in an integration. Copy it to a custom report.",1,"w","report");
R("Custom report","A report your company builds.","Payroll Feed Report.","What integrations use. Name it clearly and note its owner.",1,"w","report");
R("Report data source","The pool of records a report reads from.","All Workers.","The choice decides what rows can appear.",2,"w","report","data source,RDS");
R("Business object","A kind of thing Workday stores, such as Worker, Position or Organization.","Worker, Job Profile.","Fields belong to business objects. Reports start from one.",1,"w","report");
R("Field","A piece of data on a business object, available to a report.","Hire Date.","Fields can be copied into columns.",1,"w","report");
R("Related business object","An object connected to another.","Worker to Position.","You reach related objects through the field list.",2,"w","report");
R("Report type: Advanced","The type used for custom reports in integrations.","Advanced report.","The Workday examples for integrations use Advanced.",2,"w","report");
R("Simple and Matrix reports","Simple is the basic table; Matrix shows counts grouped by two things.","Count of workers by org.","Simple reports have limits: no report-specific calculated fields and no background run.",3,"w","report");
R("Composite report","A report that combines other reports.","Two reports side by side.","Not for beginners.",3,"w","report");
R("Prompt","A question a report asks before it runs.","As of date.","Integrations pass answers to prompts through the URL or integration settings.",1,"w","report");
R("Filter","A rule that keeps only some rows.","Only active workers.","A common cause of 'missing worker'.",1,"w","report");
R("Sort and grouping","Order rows or group them.","Sort by Employee ID.","Order often matters to vendors.",2,"w","report");
R("Column heading override","Change the name shown for a column.","Show 'Employee Number' for 'Employee ID'.","In XML the XML alias, not the heading, becomes the tag name.",2,"w","report");
R("XML alias","The name a field gets in XML output.","wd:Employee_ID","Changing it changes the XML shape. Tell downstream users.",3,"w","report xml");
R("Enable as web service","A report setting that makes the report callable as a web service.","The check box on the report's Advanced tab.","Workday says to always web-service-enable custom reports used in integrations.",1,"w","report raas","Enable As Web Service");
R("Web Service API Version","The version of the report's web service output.","v15 or the latest available.","An old version can lose data or show 'Instance#' headings in EIB output. Use a current one.",3,"w","report raas");
R("RaaS (Report as a Service)","Calling a custom report through a URL to get its data as XML, JSON or CSV.","A vendor reads the Payroll Feed report by URL.","Needs report access and a secure login. Copy the URL from Web Service > View URLs in the tenant.",1,"w","report raas","Reports as a Service,report as a service").D(["Default output is Workday XML.","Alternates include CSV, JSON, Simple XML.","Alternate formats drop Workday IDs and reference IDs.","The guides we checked show OAuth 2.0 (authorization code with PKCE) as the recipe.","Limits: report data up to 2 GB, 6 hours, and HTTP 503 under heavy load.","The literal URL pattern is not in those guides. Copy it from the tenant."]);
R("Output format: Workday XML","The default XML shape of report output.","<wd:Report_Data> ...","Use it for XSLT work.",2,"w","report xml");
R("Simple XML","A flatter XML output.","One tag per column.","Easier to read. Drops IDs.",2,"w","report xml");
R("View URLs","The related action that shows a report's web service links.","Web Service > View URLs.","Use it to get the exact URL and format links.",2,"w","report raas");
R("Report sharing","Who may run a report.","All authorized users or named groups.","Integration users need access too.",2,"w","report security");
R("Run as user","The account a report or integration runs as.","The integration system user.","Data returned depends on that account's access.",2,"w","report security");
R("Background run","A report run that is queued, not live.","A big report.","Most report types except Simple can run in the background.",3,"w","report performance");
R("Report limits","Maximum rows, run time and size.","3 million instances for indexed data sources; 6 hours for web service reports; 2 GB output.","Learn them so you know when to filter or split.",3,"w","report performance");
R("Calculated field","A custom field you build from other fields with a function.","Full Name = First + Last.","Used in reports, integrations and business processes. Edits can have side effects elsewhere.",1,"w","report calc");
R("Concatenate Text","Join text fields together.","Smith + , + John.","Add a text constant for separators.",2,"w","calc");
R("Text Constant","A fixed piece of text.","The word 'Active'.","Use it for separators and fixed codes.",2,"w","calc");
R("Format Date","Turn a date part into text in a pattern.","'dd/MM/yyyy'.","The mask is case-sensitive.",2,"w","calc date");
R("Format Number","Write a number in a pattern.","Two decimals.","Common for pay fields.",2,"w","calc");
R("Lookup Related Value","Get a field from a related object.","Cost center code from the worker.","The most common function.",2,"w","calc");
R("Evaluate Expression","If-this-then-that logic: first true condition wins.","If country = SG then 'SG' else 'OTHER'.","Order matters. Brackets matter.",2,"w","calc");
R("True/False Condition","A field that is true or false.","Is Active.","Used for eligibility checks.",2,"w","calc");
R("Date Difference","Days between two dates.","Tenure in days.","Handy for validation.",3,"w","calc date");
R("Count Related Instances","Count related rows.","Number of jobs per worker.","Useful to find workers with multiple jobs.",3,"w","calc");
R("Substring Text","Take part of a text.","First 3 letters.","Handy for codes.",3,"w","calc");
R("Lookup Value as of Date","Get a field value as it was on a date.","Salary on 1 Oct.","Useful for retro checks.",3,"w","calc date history");
R("Text Length","Count characters.","Length of city name.","Finds values that will be cut in the vendor file.",3,"w","calc");
R("Calculated field blank result","If the running account lacks access to the underlying fields, the result shows blank or zero, not an error.","An integration user runs a report; a column is empty.","First check: does the integration's security group have access to each field?",2,"w","calc security");
R("Integration ID / Integration IDs report","A report that shows reference IDs for objects.","Integration IDs > View IDs.","Use it to find the reference ID to use in files.",2,"w","ids");
R("Prism and analytics","Workday tools for bigger analytics.","Prism Analytics.","Not core to the job, but you may hear it.",3,"w","report");
R("Data sources and domain security","Reports can only show data the running account may see.","A report secured by a domain.","Two accounts can see different data from the same report.",2,"w","report security");
})();

(function(){

T("Integration system","A saved definition in Workday of one integration: its template, settings, schedule and delivery.","'Payroll Worker Feed' integration system.","Open it first when something fails. Everything about the integration is there.",1,"w","tools");
T("Integration template","A ready-made starting point for an integration, with its services, attributes and maps.","The Core Connector: Worker template.","Pick the template that matches the job; do not build from scratch if one fits.",2,"w","tools");
T("Integration service","One part of an integration that does a job, such as getting data or delivering it.","Worker Data Initialization Service.","Services can be turned on or off.",3,"w","tools");
T("Integration attribute","A setting on an integration.","File name prefix.","Change attributes instead of code when you can.",2,"w","tools");
T("Integration map","A table inside an integration that swaps Workday values for external codes.","Gender map.","Missing mappings are a top cause of wrong values.",2,"w","tools mapping");
T("Launch / Schedule Integration","The task to run an integration now or put it on a schedule.","Related action on the integration system.","Know the launch parameters before pressing the button.",1,"w","tools schedule");
T("Launch parameters","Settings given at launch: dates, Full File, as-of values.","As Of Effective Date, Full File.","Wrong parameters are a frequent cause of empty or huge files.",2,"w","tools schedule");
T("Integration event","The record of one run: status, messages, files.","Event 123456, Completed.","Your first place to look after a run.",1,"w","tools monitoring","Integration Events");
T("Event status","The result of a run.","Completed, Completed with warnings, Completed with errors, Failed, Aborted, Processing.","'Completed' does not prove the file arrived. Delivery is a separate step.",1,"w","tools monitoring");
T("Message severity","How serious a message is: INFO, WARNING, ERROR, CRITICAL.","ERROR on one worker.","CRITICAL fails the run. Inbound loads skip bad rows; outbound may send nothing on errors.",2,"w","tools monitoring");
T("Process Monitor","A Workday report of background processes.","View Background Process.","Use it to see what is running or stuck.",2,"w","tools monitoring");
T("Integration Exception Audit","A report of integrations with set-up problems.","Missing security.","Run it after changes.",3,"w","tools monitoring");
T("Document delivery","The step that sends the output file to its destination.","Deliver Document to SFTP.","Status can be Completed while delivery failed. Check both. Re-delivery is possible for a limited time.",1,"w","tools delivery");
T("Integration attachment","A file stored on an integration, such as an XSLT.","transform.xsl","Know which attachment is live.",3,"w","tools");
T("Transport protocol","The method used to deliver files: SFTP, FTPS, HTTPS, email, AS2, Amazon S3, Google Cloud Storage.","SFTP.","Only SFTP has configurable delivery attempts in the guides we checked.",2,"w","tools delivery");
T("Integration Process Event","The business process type that runs integrations.","Default two-step definition: initiation then fire integration.","Failed integration steps can terminate the whole process unless a redirect is set.",3,"w","tools bp");

T("EIB","Enterprise Interface Builder. A simple Workday tool to load data in or get data out using a spreadsheet or a report.","Load 100 salary changes from a spreadsheet.","Best for one-time bulk loads and simple feeds.",1,"w","tools eib","Enterprise Interface Builder").D(["Three parts: get data, transform, deliver.","Outbound: reads a custom report (web-service enabled) or a Get operation; one data source only; you cannot pick fields.","Inbound: you fill a spreadsheet template and load it.","Run every upload in a sandbox first.","Load Error Limit 'Unlimited' means 10,000 errors.","Validate Only checks only the documented validations."]);
T("Outbound EIB","An EIB that sends data out.","Send a worker list to a vendor every night.","Needs a web-service-enabled custom report. No XLSX output.",1,"w","tools eib");
T("Inbound EIB","An EIB that loads a spreadsheet into Workday.","Mass-update cost centers.","Uses the spreadsheet template for a web service operation. Reference ID rows decide which record changes.",1,"w","tools eib");
T("Spreadsheet template (EIB)","The Excel file you fill for an inbound load.","Web Service Spreadsheet Template.","Dates use YYYY-MM-DD. {empty} deletes a value.",2,"w","tools eib");
T("Load error limit","How many errors an EIB load tolerates.","10.","Set low in tests.",3,"w","tools eib");
T("Validate only","A load option that checks the file but does not change data.","Dry run.","It does not catch every business error.",3,"w","tools eib");
T("Auto-complete options (EIB)","Choices that skip approvals and notifications for loaded business processes.","Auto Complete.","Powerful and risky. Use only with a written approval.",3,"w","tools eib bp");
T("Mass Cancel / Mass Rescind Business Processes","Undo a bad bulk load.","Cancel in-progress; rescind completed.","Know the names before you need them.",3,"w","tools eib bp");
T("Core Connector","A ready-made outbound integration for a common job, configured with settings and maps.","Core Connector: Worker.","Try this first for standard feeds.",1,"w","tools connector","CC").D(["Built on a template; you set services, attributes and maps.","Can use report fields and calculated fields as field overrides.","Change detection compares this run with the last successful run.","Many connectors can be paired with Document Transformation to change output."]);
T("Core Connector: Worker","The connector that sends worker data and changes to other systems.","Identity, learning, time tracking tools.","Uses the transaction log to find workers with relevant events. Workday recommends the Worker Data Initialization Service for new builds.",1,"w","tools connector");
T("Transaction log","Workday's record of changes used to find who changed.","Hire, Change Job events.","If the log is off, the connector may extract everyone first.",2,"w","tools connector");
T("Worker Data Initialization Service","The newer service in Core Connector: Worker.","Recommended for new builds.","Has limits, such as fewer than about 20 field overrides and no contextual security.",3,"w","tools connector");
T("Include Multiple Positions","A Core Connector: Worker option that includes additional jobs and international assignments.","Version 25 and above.","Without it, extra jobs may be missing from output.",3,"w","tools connector multiple");
T("Field override","A change to which field supplies a connector value.","Use a calculated field for Department Code.","Keep a list of overrides in your spec.",2,"w","tools connector");
T("Eligibility","A true/false field that decides if a worker is included.","Is in scope for vendor.","A frequent reason for 'missing worker'.",2,"w","tools connector");
